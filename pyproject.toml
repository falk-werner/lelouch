[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lelouch"
version = "0.0.0"
authors = [
  { name="Falk Werner" },
]
description = "Library to create autonomous agents"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/falk-werner/pygentic"
Issues = "https://github.com/falk-werner/pygentic/issues"
